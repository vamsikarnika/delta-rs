[package]
name = "delta-cpp"
version = "0.1.0"
description = "C++ (cxx) binding that reads Delta data files with deletion vectors applied, for Velox"
authors.workspace = true
keywords.workspace = true
readme.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The lib name MUST be "delta" so the cdylib is `libdelta.{dylib,so}`; that name is the
# CMake/Velox linkage contract, same as libhudi / libiceberg.
name = "delta"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true }
cxx = "1.0"
delta_kernel.workspace = true
delta_kernel_default_engine.workspace = true
futures = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true, features = ["async", "object_store"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
url = { workspace = true }

[dev-dependencies]
arrow-array = { workspace = true, features = ["ffi"] }

[build-dependencies]
cxx-build = "1.0"
